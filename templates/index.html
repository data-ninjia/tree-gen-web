<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Structure Tree Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f3; color: #1a1a1a; }

    .topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 48px; background: #fff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 14px; font-weight: 500; }
    .topbar-file { font-size: 11px; color: #666; background: #f5f5f3; padding: 3px 8px; border-radius: 6px; border: 1px solid #e5e5e5; }
    .btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid #ccc; background: transparent; cursor: pointer; color: #1a1a1a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2C5F8A; color: #fff; border-color: #2C5F8A; }
    .btn-primary:disabled { background: #2C5F8A; }

    .app { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 48px); }

    .sidebar { border-right: 1px solid #e5e5e5; overflow-y: auto; background: #fafaf8; }
    .sidebar-label { padding: 12px 12px 4px; font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
    .ms-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-left: 2px solid transparent; font-size: 12px; }
    .ms-item:hover { background: #fff; }
    .ms-item.active { border-left-color: #2C5F8A; background: #fff; font-weight: 500; }
    .ms-code { font-family: monospace; }
    .ms-badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: #E6F1FB; color: #185FA5; margin-left: auto; flex-shrink: 0; }

    .main { display: flex; flex-direction: column; overflow: hidden; background: #fff; }

    .upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 60px auto; max-width: 400px; padding: 40px; background: #fff; border: 1px dashed #ccc; border-radius: 12px; cursor: pointer; transition: border-color 0.15s; }
    .upload-area:hover { border-color: #2C5F8A; }
    .upload-area.dragover { border-color: #2C5F8A; background: #EAF3FB; }
    .upload-label { font-size: 13px; color: #666; text-align: center; line-height: 1.6; }
    .upload-btn { font-size: 12px; padding: 6px 16px; border-radius: 8px; border: 1px solid #2C5F8A; background: #2C5F8A; color: #fff; cursor: pointer; }

    .status { margin: 8px auto; max-width: 400px; font-size: 12px; color: #666; text-align: center; white-space: pre-line; }
    .status.error { color: #c0392b; }
    .status.ok { color: #1D9E75; }
    .status.warning { color: #854F0B; }

    /* Persistent warnings panel */
    .warnings-panel { background: #FFFBF0; border-bottom: 1px solid #FAC775; padding: 0; flex-shrink: 0; }
    .warnings-header { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; user-select: none; }
    .warnings-header:hover { background: #FEF6E4; }
    .warnings-icon { font-size: 13px; }
    .warnings-title { font-size: 12px; font-weight: 500; color: #854F0B; }
    .warnings-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #FAC775; color: #854F0B; }
    .warnings-toggle { margin-left: auto; font-size: 11px; color: #854F0B; opacity: 0.6; }
    .warnings-body { border-top: 1px solid #FAC775; padding: 8px 14px; display: none; max-height: 160px; overflow-y: auto; }
    .warnings-body.open { display: block; }
    .warning-item { display: flex; gap: 8px; font-size: 11px; color: #6B4000; padding: 3px 0; border-bottom: 1px solid #FDE8B0; line-height: 1.5; }
    .warning-item:last-child { border-bottom: none; }
    .warning-item-icon { flex-shrink: 0; margin-top: 1px; }
    .warnings-dismiss { font-size: 11px; color: #854F0B; background: none; border: none; cursor: pointer; margin-left: auto; opacity: 0.6; padding: 4px 0 0; }
    .warnings-dismiss:hover { opacity: 1; }

    .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 13px; }

    .panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .panel-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
    .panel-toolbar-title { font-size: 13px; font-weight: 500; font-family: monospace; }
    .panel-toolbar-desc { font-size: 12px; color: #666; }
    .panel-body { overflow-y: auto; flex: 1; }

    .system-block { border-bottom: 1px solid #e5e5e5; }
    .system-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #f5f5f3; border-bottom: 1px solid #e5e5e5; }
    .system-code { font-family: monospace; font-size: 12px; font-weight: 500; color: #2C5F8A; }
    .system-desc { font-size: 12px; color: #444; }
    .system-count { font-size: 11px; color: #999; margin-left: auto; flex-shrink: 0; }

    table.sub-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.sub-table th { text-align: left; font-size: 11px; font-weight: 500; color: #999; padding: 6px 14px; border-bottom: 1px solid #e5e5e5; background: #fff; }
    table.sub-table td { padding: 6px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    table.sub-table tr.sub-row:hover td { background: #f9f9f7; }

    .sub-code { font-family: monospace; font-size: 11px; background: #f0f0ee; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .sub-code.exception { background: #FEF6EC; color: #854F0B; }
    .cov-bar { display: inline-block; width: 40px; height: 5px; background: #e5e5e5; border-radius: 3px; vertical-align: middle; margin-right: 5px; overflow: hidden; }
    .cov-fill { height: 100%; border-radius: 3px; }
    .cov-full { background: #1D9E75; }
    .cov-part { background: #EF9F27; }
    .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; }
    .tag-common { background: #EAF3DE; color: #3B6D11; }
    .tag-exc { background: #FAEEDA; color: #854F0B; }

    .ungroup-label { font-size: 10px; color: #999; cursor: pointer; user-select: none; }
    .ungroup-label.active { color: #2C5F8A; font-weight: 500; }

    .expand-btn { font-size: 11px; color: #2C5F8A; cursor: pointer; background: none; border: none; padding: 0; display: flex; align-items: center; gap: 4px; }
    .expand-btn:hover { text-decoration: underline; }

    .raw-list { background: #fafaf8; }
    .raw-list td { padding: 0 !important; border-bottom: none !important; }
    .raw-inner { padding: 4px 14px 4px 48px; border-bottom: 1px solid #f0f0f0; }
    table.raw-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.raw-table td { padding: 3px 8px; border-bottom: 1px solid #f5f5f3; color: #555; }
    table.raw-table td:first-child { font-family: monospace; color: #2C5F8A; width: 100px; white-space: nowrap; }
    table.raw-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Structure Tree Generator</span>
  <span class="topbar-file" id="topbar-file" style="display:none"></span>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn" onclick="resetUpload()">Upload new</button>
    <button class="btn btn-primary" id="btn-generate" style="display:none" onclick="generatePdf()">Generate PDF</button>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-label">Main Systems</div>
    <div id="ms-list"></div>
  </div>

  <div class="main" id="main">
    <div id="upload-wrap">
      <div class="upload-area" id="upload-area">
        <span style="font-size:32px">📂</span>
        <div class="upload-label">Drag & drop your <strong>.xlsx</strong> file here<br>or click to browse</div>
        <button class="upload-btn" onclick="fileInput.click()">Browse file</button>
        <input type="file" id="fileInput" accept=".xlsx" style="display:none" onchange="uploadFile(this.files[0])">
      </div>
      <div class="status" id="status"></div>
    </div>

    <!-- Persistent warnings panel -->
    <div class="warnings-panel" id="warnings-panel" style="display:none">
      <div class="warnings-header" onclick="toggleWarnings()">
        <span class="warnings-icon">⚠️</span>
        <span class="warnings-title">Warnings</span>
        <span class="warnings-badge" id="warnings-count">0</span>
        <span class="warnings-toggle" id="warnings-toggle">▼ show</span>
      </div>
      <div class="warnings-body" id="warnings-body">
        <div id="warnings-list"></div>
        <button class="warnings-dismiss" onclick="dismissWarnings()">Dismiss all ×</button>
      </div>
    </div>

    <div class="placeholder" id="placeholder" style="display:none">
      Select a Main System from the sidebar
    </div>
  </div>
</div>

<script>
  let state = {
    mainSystems: [],
    active: null,
    ungroup: {},
    expanded: {},
    warnings: [],
    warningsOpen: true,
  };

  const area = document.getElementById('upload-area');
  const fileInput = document.getElementById('fileInput');

  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });

  async function uploadFile(file) {
    if (!file.name.endsWith('.xlsx')) { setStatus('Only .xlsx files are supported', 'error'); return; }
    setStatus('Uploading...');

    const form = new FormData();
    form.append('file', file);

    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();

    if (!data.ok) {
      setStatus(data.errors.map(e => `✗ ${e}`).join('\n'), 'error');
      return;
    }

    setStatus('Parsing...');

    const parseRes = await fetch('/parse', { method: 'POST' });
    const parseData = await parseRes.json();

    if (parseData.error) { setStatus(parseData.error, 'error'); return; }

    state.mainSystems = parseData.main_systems;
    state.ungroup = {};
    state.expanded = {};
    state.warnings = data.warnings || [];
    state.warningsOpen = true;

    renderSidebar(file.name);
    renderWarnings();
    setStatus('');
  }

  function renderWarnings() {
    const panel = document.getElementById('warnings-panel');
    const list = document.getElementById('warnings-list');
    const count = document.getElementById('warnings-count');
    const toggle = document.getElementById('warnings-toggle');
    const body = document.getElementById('warnings-body');

    if (!state.warnings.length) {
      panel.style.display = 'none';
      return;
    }

    panel.style.display = '';
    count.textContent = state.warnings.length;
    list.innerHTML = state.warnings.map(w =>
      `<div class="warning-item">
        <span class="warning-item-icon">⚠</span>
        <span>${w}</span>
      </div>`
    ).join('');

    body.classList.toggle('open', state.warningsOpen);
    toggle.textContent = state.warningsOpen ? '▲ hide' : '▼ show';
  }

  function toggleWarnings() {
    state.warningsOpen = !state.warningsOpen;
    renderWarnings();
  }

  function dismissWarnings() {
    state.warnings = [];
    document.getElementById('warnings-panel').style.display = 'none';
  }

  function renderSidebar(filename) {
    document.getElementById('upload-wrap').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('topbar-file').textContent = filename;
    document.getElementById('topbar-file').style.display = '';
    document.getElementById('btn-generate').style.display = '';

    const list = document.getElementById('ms-list');
    list.innerHTML = state.mainSystems.map((ms, i) => `
      <div class="ms-item" onclick="selectMainSystem(${i})" id="ms-${i}">
        <span class="ms-code">${ms.code}</span>
        <span class="ms-badge">${ms.count}</span>
      </div>
    `).join('');
  }

  function selectMainSystem(i) {
    document.querySelectorAll('.ms-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`ms-${i}`).classList.add('active');
    state.active = i;
    renderMainPanel(state.mainSystems[i], i);
  }

  function renderMainPanel(ms, msIdx) {
    document.getElementById('placeholder').style.display = 'none';

    const old = document.getElementById('main-panel');
    if (old) old.remove();

    const panel = document.createElement('div');
    panel.id = 'main-panel';
    panel.className = 'panel';
    panel.innerHTML = `
      <div class="panel-toolbar">
        <span class="panel-toolbar-title">${ms.code}</span>
        <span class="panel-toolbar-desc">${ms.description}</span>
        <span style="margin-left:auto;font-size:11px;color:#999">
          ${ms.count} instance${ms.count > 1 ? 's' : ''} &nbsp;·&nbsp;
          ${ms.systems.length} systems
        </span>
      </div>
      <div class="panel-body">
        ${ms.systems.map((sys, si) => renderSystemBlock(sys, si, ms.count, msIdx)).join('')}
      </div>
    `;

    document.getElementById('main').appendChild(panel);
  }

  function renderSystemBlock(sys, si, total, msIdx) {
    const commonCount = sys.subsystems.filter(s => s.is_common).length;
    const excCount = sys.subsystems.length - commonCount;

    const rows = sys.subsystems.map((sub, subIdx) => {
      const pct = total > 0 ? Math.round(sub.present_in.length / total * 100) : 100;
      const isFull = sub.is_common;
      const codeClass = isFull ? 'sub-code' : 'sub-code exception';
      const tag = isFull
        ? '<span class="tag tag-common">STATIC</span>'
        : '<span class="tag tag-exc">OPTIONAL</span>';
      const bar = isFull
        ? `<span class="cov-bar"><span class="cov-fill cov-full" style="width:100%"></span></span>`
        : `<span class="cov-bar"><span class="cov-fill cov-part" style="width:${pct}%"></span></span>`;

      const ungroupKey = `${msIdx}|${sys.prefix}|${subIdx}`;
      const isUngrouped = !!state.ungroup[ungroupKey];
      const isExpanded = !!state.expanded[ungroupKey];
      const rawCount = sub.raw_codes.length;

      const expandBtn = rawCount > 1
        ? `<button class="expand-btn" onclick="toggleExpand('${ungroupKey}')">
             ${isExpanded ? `▼ hide (${rawCount})` : `▶ show (${rawCount})`}
           </button>`
        : `<span style="font-size:11px;color:#ccc">—</span>`;

      const ungroupCell = rawCount > 1
        ? `<label style="display:flex;align-items:center;gap:4px;cursor:pointer">
             <input type="checkbox" ${isUngrouped ? 'checked' : ''}
               onchange="toggleUngroup('${ungroupKey}')">
             <span class="ungroup-label ${isUngrouped ? 'active' : ''}">UNGROUP</span>
           </label>`
        : '';

      const rawRows = rawCount > 1
        ? `<tr class="raw-list" id="raw-${ungroupKey.replace(/\|/g,'_')}"
              style="${isExpanded ? '' : 'display:none'}">
             <td colspan="6" style="padding:0 !important;border-bottom:none !important;">
               <table class="sub-table" style="background:#fafaf8">
                 ${sub.raw_codes.map(c => {
                   const rawDesc = sub.raw_descriptions[c] || '';
                   // Use per-code present_in if available, else fall back to parent
                   const rawPresent = (sub.raw_present_in && sub.raw_present_in[c])
                     ? sub.raw_present_in[c]
                     : sub.present_in;
                   const rawPresentCount = rawPresent.length;
                   const isRawCommon = rawPresentCount === total;
                   const rawPct = total > 0 ? Math.round(rawPresentCount / total * 100) : 100;
                   const rawBar = isRawCommon
                     ? `<span class="cov-bar" style="background:#d4edda"><span class="cov-fill cov-full" style="width:100%"></span></span>`
                     : `<span class="cov-bar" style="background:#fde8c8"><span class="cov-fill cov-part" style="width:${rawPct}%"></span></span>`;
                   const rawTag = isRawCommon
                     ? '<span class="tag tag-common">STATIC</span>'
                     : '<span class="tag tag-exc">OPTIONAL</span>';
                   return `<tr style="background:#fafaf8">
                     <td style="width:90px"></td>
                     <td style="width:130px;padding-left:28px">
                       <span class="sub-code" style="font-size:11px">=${c}</span>
                     </td>
                     <td style="color:#555;max-width:260px">${rawDesc}</td>
                     <td style="width:110px"><span style="font-size:11px;color:#999">${rawPresentCount}/${total}</span></td>
                     <td style="width:80px">${rawTag}</td>
                     <td style="width:90px"></td>
                   </tr>`;
                 }).join('')}
               </table>
             </td>
           </tr>`
        : '';

      return `
        <tr class="sub-row">
          <td>${ungroupCell}</td>
          <td><span class="${codeClass}">${sub.code}</span></td>
          <td style="color:#555;max-width:260px">${sub.description}</td>
          <td><span style="font-size:11px;color:#999">${sub.present_in.length}/${total}</span></td>
          <td>${tag}</td>
          <td>${expandBtn}</td>
        </tr>
        ${rawRows}
      `;
    }).join('');

    return `
      <div class="system-block">
        <div class="system-header">
          <span class="system-code">=${sys.prefix}</span>
          <span class="system-desc">${sys.description}</span>
          <span class="system-count">
            ${commonCount} common${excCount > 0 ? ` · ${excCount} optional` : ''}
          </span>
        </div>
        <table class="sub-table">
          <thead>
            <tr>
              <th style="width:90px"></th>
              <th style="width:130px">Code</th>
              <th>Description</th>
              <th style="width:110px">Coverage</th>
              <th style="width:80px">Status</th>
              <th style="width:90px">Raw codes</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function toggleUngroup(key) {
    state.ungroup[key] = !state.ungroup[key];
    if (state.active !== null) {
      renderMainPanel(state.mainSystems[state.active], state.active);
      document.querySelectorAll('.ms-item').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(`ms-${state.active}`);
      if (el) el.classList.add('active');
    }
  }

  function toggleExpand(key) {
    state.expanded[key] = !state.expanded[key];
    const safeKey = key.replace(/\|/g, '_');
    const row = document.getElementById(`raw-${safeKey}`);
    const btn = document.querySelector(`button[onclick="toggleExpand('${key}')"]`);
    if (row) row.style.display = state.expanded[key] ? '' : 'none';
    if (btn) {
      const sub = findSubByKey(key);
      const count = sub ? sub.raw_codes.length : '?';
      btn.textContent = state.expanded[key] ? `▼ hide (${count})` : `▶ show (${count})`;
    }
  }

  function findSubByKey(key) {
    const [msIdx, prefix, subIdx] = key.split('|');
    const ms = state.mainSystems[parseInt(msIdx)];
    if (!ms) return null;
    const sys = ms.systems.find(s => s.prefix === prefix);
    if (!sys) return null;
    return sys.subsystems[parseInt(subIdx)] || null;
  }

  async function generatePdf() {
    const btn = document.getElementById('btn-generate');
    btn.textContent = 'Generating...';
    btn.disabled = true;

    try {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ungroup: state.ungroup }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Generation failed');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const ts = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 15);
      a.download = `structure_tree_${ts}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } finally {
      btn.textContent = 'Generate PDF';
      btn.disabled = false;
    }
  }

  function resetUpload() {
    state = { mainSystems: [], active: null, ungroup: {}, expanded: {}, warnings: [], warningsOpen: true };
    document.getElementById('upload-wrap').style.display = '';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('topbar-file').style.display = 'none';
    document.getElementById('btn-generate').style.display = 'none';
    document.getElementById('warnings-panel').style.display = 'none';
    document.getElementById('ms-list').innerHTML = '';
    document.getElementById('fileInput').value = '';
    const old = document.getElementById('main-panel');
    if (old) old.remove();
    setStatus('');
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }
</script>

</body>
</html>
