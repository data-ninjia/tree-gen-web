<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Structure Tree Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f3; color: #1a1a1a; }

    .topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 48px; background: #fff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 14px; font-weight: 500; }
    .topbar-file { font-size: 11px; color: #666; background: #f5f5f3; padding: 3px 8px; border-radius: 6px; border: 1px solid #e5e5e5; }
    .btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid #ccc; background: transparent; cursor: pointer; color: #1a1a1a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2C5F8A; color: #fff; border-color: #2C5F8A; }
    .btn-primary:disabled { background: #2C5F8A; }

    .app { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 48px); }

    .sidebar { border-right: 1px solid #e5e5e5; overflow-y: auto; background: #fafaf8; }
    .sidebar-label { padding: 12px 12px 4px; font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
    .ms-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-left: 2px solid transparent; font-size: 12px; }
    .ms-item:hover { background: #fff; }
    .ms-item.active { border-left-color: #2C5F8A; background: #fff; font-weight: 500; }
    .ms-code { font-family: monospace; }
    .ms-badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: #E6F1FB; color: #185FA5; margin-left: auto; flex-shrink: 0; }

    .main { display: flex; flex-direction: column; overflow: hidden; background: #fff; }

    .upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 60px auto; max-width: 400px; padding: 40px; background: #fff; border: 1px dashed #ccc; border-radius: 12px; cursor: pointer; transition: border-color 0.15s; }
    .upload-area:hover { border-color: #2C5F8A; }
    .upload-area.dragover { border-color: #2C5F8A; background: #EAF3FB; }
    .upload-label { font-size: 13px; color: #666; text-align: center; line-height: 1.6; }
    .upload-btn { font-size: 12px; padding: 6px 16px; border-radius: 8px; border: 1px solid #2C5F8A; background: #2C5F8A; color: #fff; cursor: pointer; }

    .status { margin: 8px auto; max-width: 400px; font-size: 12px; color: #666; text-align: center; white-space: pre-line; }
    .status.error { color: #c0392b; }
    .status.ok { color: #1D9E75; }
    .status.warning { color: #854F0B; }

    .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 13px; }

    .panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .panel-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
    .panel-toolbar-title { font-size: 13px; font-weight: 500; font-family: monospace; }
    .panel-toolbar-desc { font-size: 12px; color: #666; }
    .panel-body { overflow-y: auto; flex: 1; }

    .system-block { border-bottom: 1px solid #e5e5e5; }
    .system-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #f5f5f3; border-bottom: 1px solid #e5e5e5; }
    .system-code { font-family: monospace; font-size: 12px; font-weight: 500; color: #2C5F8A; }
    .system-desc { font-size: 12px; color: #444; }
    .system-count { font-size: 11px; color: #999; margin-left: auto; flex-shrink: 0; }

    table.sub-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.sub-table th { text-align: left; font-size: 11px; font-weight: 500; color: #999; padding: 6px 14px; border-bottom: 1px solid #e5e5e5; background: #fff; }
    table.sub-table td { padding: 6px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    table.sub-table tr:hover td { background: #f9f9f7; }

    .sub-code { font-family: monospace; font-size: 11px; background: #f0f0ee; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .sub-code.exception { background: #FEF6EC; color: #854F0B; }
    .cov-bar { display: inline-block; width: 40px; height: 5px; background: #e5e5e5; border-radius: 3px; vertical-align: middle; margin-right: 5px; overflow: hidden; }
    .cov-fill { height: 100%; border-radius: 3px; }
    .cov-full { background: #1D9E75; }
    .cov-part { background: #EF9F27; }
    .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; }
    .tag-common { background: #EAF3DE; color: #3B6D11; }
    .tag-exc { background: #FAEEDA; color: #854F0B; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Structure Tree Generator</span>
  <span class="topbar-file" id="topbar-file" style="display:none"></span>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn" onclick="resetUpload()">Upload new</button>
    <button class="btn btn-primary" id="btn-generate" style="display:none" onclick="generatePdf()">Generate PDF</button>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-label">Main Systems</div>
    <div id="ms-list"></div>
  </div>

  <div class="main" id="main">
    <div id="upload-wrap">
      <div class="upload-area" id="upload-area">
        <span style="font-size:32px">📂</span>
        <div class="upload-label">Drag & drop your <strong>.xlsx</strong> file here<br>or click to browse</div>
        <button class="upload-btn" onclick="fileInput.click()">Browse file</button>
        <input type="file" id="fileInput" accept=".xlsx" style="display:none" onchange="uploadFile(this.files[0])">
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="placeholder" id="placeholder" style="display:none">
      Select a Main System from the sidebar
    </div>
  </div>
</div>

<script>
  let state = { mainSystems: [], active: null };

  const area = document.getElementById('upload-area');
  const fileInput = document.getElementById('fileInput');

  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });

  async function uploadFile(file) {
    if (!file.name.endsWith('.xlsx')) { setStatus('Only .xlsx files are supported', 'error'); return; }
    setStatus('Uploading...');

    const form = new FormData();
    form.append('file', file);

    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();

    if (!data.ok) {
      setStatus(data.errors.map(e => `✗ ${e}`).join('\n'), 'error');
      return;
    }

    if (data.warnings.length > 0) {
      setStatus(data.warnings.map(w => `⚠ ${w}`).join('\n'), 'warning');
    } else {
      setStatus('✓ File looks good — parsing...', 'ok');
    }

    const parseRes = await fetch('/parse', { method: 'POST' });
    const parseData = await parseRes.json();

    if (parseData.error) { setStatus(parseData.error, 'error'); return; }

    state.mainSystems = parseData.main_systems;
    renderSidebar(file.name);
  }

  function renderSidebar(filename) {
    document.getElementById('upload-wrap').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('topbar-file').textContent = filename;
    document.getElementById('topbar-file').style.display = '';
    document.getElementById('btn-generate').style.display = '';

    const list = document.getElementById('ms-list');
    list.innerHTML = state.mainSystems.map((ms, i) => `
      <div class="ms-item" onclick="selectMainSystem(${i})" id="ms-${i}">
        <span class="ms-code">${ms.code}</span>
        <span class="ms-badge">${ms.count}</span>
      </div>
    `).join('');
  }

  function selectMainSystem(i) {
    document.querySelectorAll('.ms-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`ms-${i}`).classList.add('active');
    state.active = i;
    renderMainPanel(state.mainSystems[i]);
  }

  function renderMainPanel(ms) {
    document.getElementById('placeholder').style.display = 'none';

    const old = document.getElementById('main-panel');
    if (old) old.remove();

    const total = ms.count;

    const panel = document.createElement('div');
    panel.id = 'main-panel';
    panel.className = 'panel';
    panel.innerHTML = `
      <div class="panel-toolbar">
        <span class="panel-toolbar-title">${ms.code}</span>
        <span class="panel-toolbar-desc">${ms.description}</span>
        <span style="margin-left:auto;font-size:11px;color:#999">
          ${ms.count} instance${ms.count > 1 ? 's' : ''} &nbsp;·&nbsp;
          ${ms.systems.length} systems
        </span>
      </div>
      <div class="panel-body">
        ${ms.systems.map((sys, si) => renderSystemBlock(sys, si, total)).join('')}
      </div>
    `;

    document.getElementById('main').appendChild(panel);
  }

  function renderSystemBlock(sys, si, total) {
    const commonCount = sys.subsystems.filter(s => s.is_common).length;
    const excCount = sys.subsystems.length - commonCount;

    const rows = sys.subsystems.map(sub => {
      const pct = total > 0 ? Math.round(sub.present_in.length / total * 100) : 100;
      const isFull = sub.is_common;
      const codeClass = isFull ? 'sub-code' : 'sub-code exception';
      const tag = isFull
        ? '<span class="tag tag-common">common</span>'
        : '<span class="tag tag-exc">exception</span>';
      const bar = isFull
        ? `<span class="cov-bar"><span class="cov-fill cov-full" style="width:100%"></span></span>`
        : `<span class="cov-bar"><span class="cov-fill cov-part" style="width:${pct}%"></span></span>`;

      return `<tr>
        <td><span class="${codeClass}">${sub.code}</span></td>
        <td style="color:#555">${sub.description}</td>
        <td>${bar}<span style="font-size:11px;color:#999">${sub.present_in.length}/${total}</span></td>
        <td>${tag}</td>
      </tr>`;
    }).join('');

    return `
      <div class="system-block">
        <div class="system-header">
          <span class="system-code">=${sys.prefix}</span>
          <span class="system-desc">${sys.description}</span>
          <span class="system-count">
            ${commonCount} common${excCount > 0 ? ` · ${excCount} exceptions` : ''}
          </span>
        </div>
        <table class="sub-table">
          <thead>
            <tr>
              <th style="width:130px">Code</th>
              <th>Description</th>
              <th style="width:110px">Coverage</th>
              <th style="width:80px">Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  async function generatePdf() {
    const btn = document.getElementById('btn-generate');
    btn.textContent = 'Generating...';
    btn.disabled = true;

    try {
      const res = await fetch('/generate', { method: 'POST' });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Generation failed');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'structure_tree.pdf';
      a.click();
      URL.revokeObjectURL(url);
    } finally {
      btn.textContent = 'Generate PDF';
      btn.disabled = false;
    }
  }

  function resetUpload() {
    state = { mainSystems: [], active: null };
    document.getElementById('upload-wrap').style.display = '';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('topbar-file').style.display = 'none';
    document.getElementById('btn-generate').style.display = 'none';
    document.getElementById('ms-list').innerHTML = '';
    document.getElementById('fileInput').value = '';
    const old = document.getElementById('main-panel');
    if (old) old.remove();
    setStatus('');
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }
</script>

</body>
</html>
